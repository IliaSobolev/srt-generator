name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem would this solve? }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: Proposed solution }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This works fully on-device. It doesn't need a server, an account or telemetry.
