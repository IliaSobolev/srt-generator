name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODE_VERSION: "26.6"

jobs:
  release:
    name: Build DMG and publish GitHub Release
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write # create the release; only this job gets write access
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # build number = commit count
          persist-credentials: false

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app" && xcodebuild -version

      - name: Tag must match VERSION
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match VERSION ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Tests
        run: swift test

      - name: Network policy
        run: scripts/check-network-policy.sh

      # Unsigned (ad-hoc) build: the project has no Apple Developer ID. See docs/RELEASE.md to add notarization.
      - name: Build app and DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./build-app.sh
          scripts/make-dmg.sh "$VERSION"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then echo "::error::No CHANGELOG.md section for $VERSION"; exit 1; fi
          {
            echo
            echo "**Unsigned build.** On first launch, macOS Gatekeeper blocks it: see the README's *Download* section."
            echo "Verify the download: \`shasum -a 256 -c SRTGenerator-$VERSION.dmg.sha256\`"
          } >> notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}" --verify-tag --title "SRT Generator $VERSION" --notes-file notes.md \
            "dist/SRTGenerator-$VERSION.dmg" "dist/SRTGenerator-$VERSION.dmg.sha256"
