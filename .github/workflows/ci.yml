name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token; no secrets are needed, so PRs from forks run the same checks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.6"

jobs:
  ci:
    name: Lint, build, test, coverage, network policy
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM and tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            .tools
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('Package.resolved', 'scripts/bootstrap-tools.sh') }}
          restore-keys: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      - name: Tools (pinned, SHA-256 verified)
        run: scripts/bootstrap-tools.sh swiftlint swiftformat actionlint

      - name: Lint
        run: make lint

      - name: Validate workflows
        run: make actionlint

      - name: Build (warnings are errors)
        run: make build

      # Unit + architecture tests and the SRTCore coverage gate. Tests use fakes and generated fixtures:
      # they never download models or touch the network.
      - name: Test + coverage gate
        run: make coverage

      - name: Network policy
        run: make policy

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: .build/reports/
          if-no-files-found: warn
          retention-days: 14
